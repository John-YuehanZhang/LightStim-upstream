# Which provider and model each role uses. Edit this file to change the
# assignment; nothing else in the pipeline hard-codes a model.
#
# provider: claude_oauth | anthropic_api | deepseek | openai (openai not yet implemented:
#           it needs the Codex CLI as its harness instead of Claude Code)
# model:    passed to the harness's --model flag
# max_turns / wall_hours: per-process limits (keep wall_hours < 5 for subscription windows)

[roles.main]
provider = "claude_oauth"
model = "opus"
max_turns = 80
wall_hours = 1.0

[roles.worker]
provider = "claude_oauth"
model = "opus"
max_turns = 250
wall_hours = 4.5

[roles.refuter]
provider = "claude_oauth"
model = "opus"
max_turns = 120
wall_hours = 2.0

[roles.novelty]
provider = "claude_oauth"
model = "opus"
max_turns = 80
wall_hours = 1.0

[providers.claude_oauth]
harness = "claude"
tokens_file = "/nvme2n1/yuehan_zhang/.secrets/claude_oauth_tokens.txt"
# accounts that still have Fable quota are kept for Fable roles
reserve_for_fable = ["acct2", "acct7"]
probe_cache_minutes = 30

[providers.anthropic_api]
harness = "claude"
key_file = "/nvme2n1/yuehan_zhang/.secrets/anthropic_api_key.txt"

[providers.deepseek]
harness = "claude"
key_file = "/nvme2n1/yuehan_zhang/.secrets/deepseek_api_key.txt"
base_url = "https://api.deepseek.com/anthropic"
small_fast_model = "deepseek-flash"

[providers.openai]
harness = "codex"
key_file = "/nvme2n1/yuehan_zhang/.secrets/openai_api_key.txt"

# Operator limits for the round loop (never shown to agents).
[orchestrator]
# workers per round = min(max_workers, accounts with quota for the worker model)
max_workers = 6
# relaunches of a worker whose process failed for a reason other than a usage limit
max_relaunch = 2
# attempts of the main agent per round before the loop stops
main_attempts = 3
# subagents a process may run, from its account's remaining quota: [[min headroom, n], ...]
subagent_thresholds = [[0.5, 2], [0.2, 1]]
# every agent process is pinned (taskset) to its own block of cores
cpus_per_agent = 16
cpu_first = 0
cpu_slots = 8

[audit]
# hosts the harness itself contacts; anything else in a solving role's proxy log is a finding
harness_hosts = ["api.anthropic.com", "statsig.anthropic.com", "console.anthropic.com", "claude.ai",
                 "sentry.io", "datadoghq.com", "api.deepseek.com", "downloads.claude.ai", "storage.googleapis.com"]
